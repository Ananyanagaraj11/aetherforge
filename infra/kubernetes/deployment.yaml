apiVersion: apps/v1
kind: Deployment
metadata:
  name: aetherforge-api
  namespace: aetherforge
  labels:
    app: aetherforge-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aetherforge-api
  template:
    metadata:
      labels:
        app: aetherforge-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: api
          image: ghcr.io/ananyanagaraj11/aetherforge:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: aetherforge-config
            - secretRef:
                name: aetherforge-db
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 8
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: aetherforge-api
  namespace: aetherforge
spec:
  selector:
    app: aetherforge-api
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: aetherforge-api
  namespace: aetherforge
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: aetherforge-api
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aetherforge
  namespace: aetherforge
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - host: aetherforge.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aetherforge-api
                port:
                  number: 80
