services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aetherforge
      POSTGRES_PASSWORD: aetherforge
      POSTGRES_DB: aetherforge
    ports:
      - "5433:5432"
    volumes:
      - af_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aetherforge"]
      interval: 5s
      timeout: 5s
      retries: 8

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql+psycopg://aetherforge:aetherforge@postgres:5432/aetherforge
      REDIS_URL: redis://redis:6379/0
      PORT: "8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  af_pg:
